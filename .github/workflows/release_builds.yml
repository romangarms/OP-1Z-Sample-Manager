name: Build & Release (Windows/macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/_tests.yml

  build_windows:
    uses: ./.github/workflows/_build.yml
    with:
      os: windows-latest
      platform: windows
      version_label: ${{ github.ref_name }}
      upload_artifact: true
      fetch_changelog: true

  build_macos:
    uses: ./.github/workflows/_build.yml
    with:
      os: macos-latest
      platform: macos
      version_label: ${{ github.ref_name }}
      upload_artifact: true
      fetch_changelog: true

  release:
    needs:
      - tests
      - build_windows
      - build_macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
